name: Publish multi-architecture image

on:
  push:
    branches:
      - main
    paths:
      - baby_monitor/**
      - frontend/**
      - tools/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - .github/workflows/release.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: home-assistant-baby-monitor
  REGISTRY_PREFIX: ghcr.io/gtassistant-sys

jobs:
  prepare:
    name: Prepare local build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read App version
        id: version
        run: |
          version="$(sed -n 's/^version: *"\([^"\]*\)"/\1/p' baby_monitor/config.yaml)"
          if [[ "${version}" != "0.4.0-local.8" ]]; then
            echo "Expected local image version 0.4.0-local.8, got ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare native build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build, sign, and publish architecture image
        id: build_image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=0.4.0-local.8
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: ./baby_monitor/Dockerfile
          image: ${{ matrix.image }}
          image-tags: 0.4.0-local.8
          labels: |
            io.hass.type=app
            io.hass.name=Baby Monitor
            io.hass.description=Local-first baby monitor for Home Assistant
            io.hass.url=https://github.com/gtassistant-sys/home-assistant-baby-monitor
          push: "true"
          version: 0.4.0-local.8

      - name: Attest architecture image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          push-to-registry: true
          subject-digest: ${{ steps.build_image.outputs.digest }}
          subject-name: ${{ matrix.image }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: 0.4.0-local.8
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

      - name: Verify published manifest
        env:
          IMAGE: ${{ env.REGISTRY_PREFIX }}/${{ env.IMAGE_NAME }}:0.4.0-local.8
        run: |
          docker buildx imagetools inspect "${IMAGE}" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' /tmp/manifest.txt)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Published digest: ${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api "/user/packages/container/${IMAGE_NAME}" --jq .visibility)" = public
